    <script>
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'win') {
                    const freqs = [523.25, 659.25, 783.99, 1046.50];
                    freqs.forEach((f, index) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.type = 'triangle';
                        o.frequency.setValueAtTime(f, now + index * 0.1);
                        g.gain.setValueAtTime(0.2, now + index * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.001, now + index * 0.1 + 0.4);
                        o.start(now + index * 0.1);
                        o.stop(now + index * 0.1 + 0.4);
                    });
                } else if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.setValueAtTime(880, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(164.81, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) {
                // Audio fallback
            }
        }

        // Global State Variables
        let currentMode = 'ribbon';
        let denominator = 3;
        let numerator = 1;
        
        // Quiz State
        let userSelections = {}; // { qId: selectedOptionIdx }
        let isSubmitted = false;
        let quizScore = 0;

        // Question database with standard fraction HTML rendering
        const quizData = [
            {
                id: 1,
                question: "有一條彩帶平分成 3 等分，其中的 2 等分是幾個 <span class='fraction-math'><span class='fraction-numerator'>1</span><span class='fraction-denominator'>3</span></span> 條彩帶？也就是幾分之幾條？",
                options: [
                    "2 個 <span class='fraction-math'><span class='fraction-numerator'>1</span><span class='fraction-denominator'>3</span></span> 條，也就是 <span class='fraction-math'><span class='fraction-numerator'>2</span><span class='fraction-denominator'>3</span></span> 條",
                    "3 個 <span class='fraction-math'><span class='fraction-numerator'>1</span><span class='fraction-denominator'>3</span></span> 條，也就是 <span class='fraction-math'><span class='fraction-numerator'>3</span><span class='fraction-denominator'>3</span></span> 條",
                    "1 個 <span class='fraction-math'><span class='fraction-numerator'>1</span><span class='fraction-denominator'>3</span></span> 條，也就是 <span class='fraction-math'><span class='fraction-numerator'>1</span><span class='fraction-denominator'>3</span></span> 條",
                    "2 個 <span class='fraction-math'><span class='fraction-numerator'>1</span><span class='fraction-denominator'>2</span></span> 條，也就是 <span class='fraction-math'><span class='fraction-numerator'>2</span><span class='fraction-denominator'>2</span></span> 條"

        function stepDenominator(delta) {
            const newVal = Math.min(10, Math.max(2, denominator + delta));
            if (newVal !== denominator) {
                updateDenominator(newVal);
            }
        }

        function stepNumerator(delta) {
            const newVal = Math.min(denominator, Math.max(0, numerator + delta));
            if (newVal !== numerator) {
                updateNumerator(newVal);
            }
        }

        function updateDenominator(val) {
            playSound('click');
            denominator = parseInt(val);
            document.getElementById('label-denominator').innerText = denominator;
            document.getElementById('slider-denominator').value = denominator;
            
            const numSlider = document.getElementById('slider-numerator');
            numSlider.max = denominator;
            document.getElementById('slider-max-label').innerText = denominator + ' 份';

            if (numerator > denominator) {
                numerator = denominator;
            }
            numSlider.value = numerator;
            document.getElementById('label-numerator').innerText = numerator;

            renderSandbox();
        }

        function updateNumerator(val) {
            playSound('click');
            numerator = parseInt(val);
            document.getElementById('label-numerator').innerText = numerator;
            document.getElementById('slider-numerator').value = numerator;
            renderSandbox();
        }

        function renderSandbox() {
            document.getElementById('math-unit-num').innerText = '1';
            document.getElementById('math-unit-den').innerText = denominator;

                visCard.classList.remove('sunbeam-active');

            } else {
                visCard.classList.remove('sunbeam-active');
                fullBadge.classList.add('hidden');
                explBox.innerHTML = `這是 <b>${numerator}</b> 個 <span class="fraction-math"><span class="fraction-numerator">1</span><span class="fraction-denominator">${denominator}</span></span>，讀作「<b>${numberToChinese(denominator)}分之${numberToChinese(numerator)}</b>」，記作 <span class="fraction-math text-purple-700"><span class="fraction-numerator">${numerator}</span><span class="fraction-denominator">${denominator}</span></span>。`;
            }

            if (numerator > 0) {
                let parts = [];
                for (let i = 0; i < numerator; i++) {
                    parts.push(`<span class="fraction-math"><span class="fraction-numerator">1</span><span class="fraction-denominator">${denominator}</span></span>`);
                }
                additionBox.innerHTML = `單位分數累積： ${parts.join(' + ')} = <span class="fraction-math font-black text-orange-600 text-base"><span class="fraction-numerator">${numerator}</span><span class="fraction-denominator">${denominator}</span></span>`;

                additionBox.innerHTML = `單位分數累積： 0`;

            renderRibbon();

        function renderRibbon() {
            const container = document.getElementById('ribbon-container');
            container.innerHTML = '';

            for (let i = 0; i < denominator; i++) {
                const slice = document.createElement('div');
                const isFilled = i < numerator;

                slice.className = `interactive-slice flex-1 h-full rounded-xl flex flex-col items-center justify-center font-bold border transition-all ${
                    isFilled 
                    ? 'bg-gradient-to-b from-amber-300 to-orange-400 text-slate-900 border-amber-500 shadow' 
                    : 'bg-slate-100/90 text-slate-400 border-slate-300'
                }`;

                slice.innerHTML = `
                    <span class="text-[10px] md:text-xs ${isFilled ? 'text-slate-800' : 'text-slate-400'}">第 ${i+1} 份</span>
                    <span class="fraction-math text-xs md:text-sm mt-0.5">
                        <span class="fraction-numerator">1</span>
                        <span class="fraction-denominator">${denominator}</span>
                    </span>
                `;

                slice.onclick = () => {
                    if (numerator === i + 1) {
                        updateNumerator(i);
                    } else {
                        updateNumerator(i + 1);
                    }
                };

                container.appendChild(slice);
            }
        }

        function renderPie() {
            const svg = document.getElementById('pie-svg');
            svg.innerHTML = '';

            const radius = 92;
            const cx = 0, cy = 0;
            const angleStep = (2 * Math.PI) / denominator;

            for (let i = 0; i < denominator; i++) {
                const startAngle = i * angleStep - Math.PI / 2;
                const endAngle = (i + 1) * angleStep - Math.PI / 2;

                const x1 = cx + radius * Math.cos(startAngle);
                const y1 = cy + radius * Math.sin(startAngle);
                const x2 = cx + radius * Math.cos(endAngle);
                const y2 = cy + radius * Math.sin(endAngle);

                const largeArcFlag = angleStep > Math.PI ? 1 : 0;

                const d = [
                    `M ${cx} ${cy}`,
                    `L ${x1} ${y1}`,
                    `A ${radius} ${radius} 0 ${largeArcFlag} 1 ${x2} ${y2}`,
                    'Z'
                ].join(' ');

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const isFilled = i < numerator;

                path.setAttribute('d', d);
                path.setAttribute('class', 'pie-wedge');
                path.setAttribute('fill', isFilled ? '#f4a261' : '#f8fafc');
                path.setAttribute('stroke', '#334155');
                path.setAttribute('stroke-width', '2.5');

                path.onclick = () => {
                    if (numerator === i + 1) {
                        updateNumerator(i);
                    } else {
                        updateNumerator(i + 1);
                    }
                };

                svg.appendChild(path);

                if (denominator <= 8) {
                    const midAngle = startAngle + angleStep / 2;
                    const tx = cx + (radius * 0.6) * Math.cos(midAngle);
                    const ty = cy + (radius * 0.6) * Math.sin(midAngle);

                    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                    text.setAttribute('x', tx);
                    text.setAttribute('y', ty + 4);
                    text.setAttribute('text-anchor', 'middle');
                    text.setAttribute('font-size', '11');
                    text.setAttribute('font-weight', 'bold');
                    text.setAttribute('fill', isFilled ? '#1e293b' : '#94a3b8');
                    text.textContent = `1/${denominator}`;
                    svg.appendChild(text);
                }
            }
        }

        function selectOption(qId, optIdx) {
            if (isSubmitted) return;

            renderQuiz();
        }

        function submitQuiz() {
            playSound('click');
            isSubmitted = true;
            
            quizScore = 0;
            let answeredCount = 0;

            quizData.forEach(item => {
                const sel = userSelections[item.id];
                if (sel !== undefined) {
                    answeredCount++;
                    if (sel === item.answer) {
                        quizScore += 20; // 5 questions * 20 pts = 100 max
                    }
                }
            });

            document.getElementById('quiz-score').innerText = quizScore;
            renderQuiz();

            if (quizScore === 100) {
                playSound('win');
                showModal(true, "太棒了！獲得滿分 100 分！ 🎉", "你已經完全掌握分數與 1 的概念了！繼續保持！");
            } else if (answeredCount < quizData.length) {
                playSound('wrong');
                showModal(false, "測驗完成！", `本次得分：<b>${quizScore}</b> / 100 分<br>注意：部分題目<span class="text-amber-600 font-bold">未作答</span>，請參考解析並點擊「重新測驗」再試一次！`);
            } else {
                playSound('correct');
                showModal(true, "測驗完成！", `本次得分：<b>${quizScore}</b> / 100 分<br>可參考下方解析檢視錯題，訂正後點選「重新測驗」再次挑戰！`);
            }
        }

        function resetQuiz() {
            playSound('click');
            userSelections = {};
            isSubmitted = false;
            quizScore = 0;
            document.getElementById('quiz-score').innerText = "0";
            renderQuiz();
        }

        function showModal(isSuccess, title, msg) {
            const modal = document.getElementById('custom-modal');
            const iconWrap = document.getElementById('modal-icon-wrap');
            const titleEl = document.getElementById('modal-title');
            const msgEl = document.getElementById('modal-msg');

            if (isSuccess) {
                iconWrap.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl bg-emerald-100 text-emerald-600 border-2 border-emerald-300";
                iconWrap.innerHTML = '<i class="fa-solid fa-award"></i>';
            } else {
                iconWrap.className = "w-16 h-16 rounded-full mx-auto flex items-center justify-center text-3xl bg-amber-100 text-amber-600 border-2 border-amber-300";
                iconWrap.innerHTML = '<i class="fa-solid fa-lightbulb"></i>';
            }

            titleEl.innerText = title;
            msgEl.innerHTML = msg;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            playSound('click');
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function numberToChinese(num) {
            const map = ['零','一','二','三','四','五','六','七','八','九','十'];
            return map[num] || num;
        }
    </script>
</body>
</html>
