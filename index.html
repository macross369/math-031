        let unitUrls = {};
        let completedUnits = {};
        let expandedSubsections = {};
        let currentFilter = 'all';

        window.addEventListener('DOMContentLoaded', () => {
            loadSavedData();
            renderUnits();
            updateProgressStats();
        });

        function loadSavedData() {
            try {
                const savedUrls = localStorage.getItem('math3a_unit_urls');
                if (savedUrls) {
                    unitUrls = JSON.parse(savedUrls);
                } else {
                    unitsData.forEach(u => {
                        unitUrls[u.id] = u.defaultUrl;
                        if (u.subsections) {
                            u.subsections.forEach(sub => {
                                unitUrls[sub.id] = sub.defaultUrl;
                            });
                        }
                    });
                }

                const savedCompleted = localStorage.getItem('math3a_completed_units');
                if (savedCompleted) {
                    completedUnits = JSON.parse(savedCompleted);
                }
            } catch (e) {
                console.error("Local storage error", e);
            }
        }

        function saveData() {
            localStorage.setItem('math3a_unit_urls', JSON.stringify(unitUrls));
            localStorage.setItem('math3a_completed_units', JSON.stringify(completedUnits));
        }

        function renderUnits() {
            const grid = document.getElementById('unitsGrid');
            grid.innerHTML = '';

            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = unitsData.filter(unit => {
                const matchesCat = (currentFilter === 'all') || (unit.category === currentFilter);
                const matchesSearch = unit.title.toLowerCase().includes(searchVal) || 
                                      unit.unitNum.toLowerCase().includes(searchVal) ||
                                      unit.desc.toLowerCase().includes(searchVal) ||
                                      unit.tags.some(t => t.toLowerCase().includes(searchVal)) ||
                                      (unit.subsections && unit.subsections.some(s => s.id.toLowerCase().includes(searchVal) || s.title.toLowerCase().includes(searchVal)));
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-3xl mb-2 opacity-50"></i>
                        <p>找不到符合條件的單元或小節</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(unit => {
                const isCompleted = !!completedUnits[unit.id];
                const isExpanded = !!expandedSubsections[unit.id];

                let subHtml = '';
                if (unit.subsections && unit.subsections.length > 0) {
                    subHtml = `
                        <div id="sub_section_${unit.id}" class="${isExpanded ? 'block' : 'hidden'} mt-3 pt-3 border-t border-white/10 transition-all">
                            <div class="text-[11px] font-bold text-cyan-300/90 mb-2 flex items-center justify-between">
                                <span><i class="fa-solid fa-layer-group mr-1"></i>小節學習頁面：</span>
                            </div>
                            <div class="grid grid-cols-2 sm:grid-cols-2 gap-1.5">
                                ${unit.subsections.map(sub => {
                                    const subUrl = unitUrls[sub.id] || sub.defaultUrl;
                                    return `
                                        <a href="${subUrl}" target="_blank" title="${sub.id} ${sub.title}" 
                                           class="px-2 py-1.5 bg-slate-900/90 hover:bg-cyan-500/20 text-cyan-200 hover:text-white border border-white/10 hover:border-cyan-400/50 rounded-lg transition-all flex flex-col justify-center group/sub">
                                            <span class="text-[10px] font-extrabold text-cyan-400 group-hover/sub:text-cyan-300">${sub.id}</span>
                                            <span class="truncate w-full text-[11px] font-medium text-slate-300 group-hover/sub:text-white">${sub.title}</span>
                                        </a>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                }

                const card = document.createElement('div');
                card.className = `glass-card rounded-2xl p-5 flex flex-col justify-between relative overflow-hidden group ${isCompleted ? 'border-emerald-500/40 bg-slate-900/40' : ''}`;

                card.innerHTML = `
                    <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br ${unit.color} opacity-10 rounded-bl-full pointer-events-none group-hover:opacity-20 transition-opacity"></div>
                    
                    <div>
                        <!-- Header / Unit Number -->
                        <div class="flex items-center justify-between mb-3">
                            <span class="px-2.5 py-1 rounded-lg text-xs font-bold border ${unit.badgeColor}">
                                ${unit.unitNum}
                            </span>
                            <button onclick="toggleCompleted('${unit.id}')" title="切換完成狀態" class="flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full transition-all ${isCompleted ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-400/30' : 'bg-slate-800 text-slate-400 hover:text-slate-200 border border-white/5'}">
                                <i class="fa-solid ${isCompleted ? 'fa-circle-check text-emerald-400' : 'fa-circle'}"></i>
                                <span>${isCompleted ? '已標記完成' : '標記完成'}</span>
                            </button>
                        </div>

                        <!-- Title & Icon -->
                        <div class="flex items-start gap-3 mb-3">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${unit.color} flex items-center justify-center text-white text-lg shadow-md shrink-0 mt-0.5">
                                <i class="fa-solid ${unit.icon}"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-white group-hover:text-cyan-300 transition-colors">
                                    ${unit.title}

                                <p class="text-xs text-slate-300 mt-1 line-clamp-2 leading-relaxed">
                                    ${unit.desc}

                            </div>

                        <div class="flex flex-wrap gap-1.5 mb-3 mt-2">
                            ${unit.tags.map(tag => `<span class="text-[11px] bg-slate-900/60 text-slate-300 px-2 py-0.5 rounded-md border border-white/5"># ${tag}</span>`).join('')}

                grid.appendChild(card);

        function toggleSubsections(unitId) {
            expandedSubsections[unitId] = !expandedSubsections[unitId];
            const subElem = document.getElementById(`sub_section_${unitId}`);
            if (subElem) {
                if (expandedSubsections[unitId]) {
                    subElem.classList.remove('hidden');
                    subElem.classList.add('block');
                } else {
                    subElem.classList.add('hidden');
                    subElem.classList.remove('block');
                }
            }
        }

        function toggleCompleted(unitId) {
            completedUnits[unitId] = !completedUnits[unitId];
            saveData();
            renderUnits();
            updateProgressStats();
            showToast(completedUnits[unitId] ? "已將單元標記為完成！" : "已取消單元完成標記");
        }

        function updateProgressStats() {
            const mainUnits = unitsData.filter(u => typeof u.id === 'number');
            const total = mainUnits.length;
            const completedCount = mainUnits.filter(u => completedUnits[u.id]).length;
            const percent = Math.round((completedCount / total) * 100);

            document.getElementById('totalCount').innerText = total;
            document.getElementById('completedCount').innerText = completedCount;
            document.getElementById('progressText').innerText = `${percent}%`;

            const circle = document.getElementById('progressCircle');
            circle.setAttribute('stroke-dasharray', `${percent}, 100`);
        }

        function resetProgress() {
            completedUnits = {};
            saveData();
            renderUnits();
            updateProgressStats();
            showToast("學習紀錄已重置");
        }

        function saveUnitLinks() {
            unitsData.forEach(u => {
                const input = document.getElementById(`url_input_${u.id}`);
                if (input) {
                    unitUrls[u.id] = input.value.trim() || u.defaultUrl;

                if (u.subsections) {
                    u.subsections.forEach(sub => {

                            unitUrls[sub.id] = subInput.value.trim() || sub.defaultUrl;

        function initBase10Logic() {
            const input = document.getElementById('base10Input');
            const randBtn = document.getElementById('base10RandBtn');

            const updateMoney = () => {
                let val = parseInt(input.value) || 0;
                if (val > 9999) val = 9999;
                if (val < 0) val = 0;

                const th = Math.floor(val / 1000);
                const hu = Math.floor((val % 1000) / 100);
                const te = Math.floor((val % 100) / 10);
                const un = val % 10;

                document.getElementById('digitTh').innerText = th;
                document.getElementById('digitHu').innerText = hu;
                document.getElementById('digitTe').innerText = te;
                document.getElementById('digitUn').innerText = un;

                document.getElementById('moneyTh').innerHTML = th > 0 ? `<span class="bg-blue-600/30 border border-blue-400/40 text-blue-200 px-1.5 py-0.5 rounded text-[10px] font-bold">1000</span>`.repeat(th) : '<span class="text-slate-600">-</span>';
                document.getElementById('moneyHu').innerHTML = hu > 0 ? `<span class="bg-emerald-600/30 border border-emerald-400/40 text-emerald-200 px-1.5 py-0.5 rounded text-[10px] font-bold">100</span>`.repeat(hu) : '<span class="text-slate-600">-</span>';
                document.getElementById('moneyTe').innerHTML = te > 0 ? `<span class="bg-amber-600/30 border border-amber-400/40 text-amber-200 px-1.5 py-0.5 rounded text-[10px] font-bold">10</span>`.repeat(te) : '<span class="text-slate-600">-</span>';
                document.getElementById('moneyUn').innerHTML = un > 0 ? `<span class="bg-rose-600/30 border border-rose-400/40 text-rose-200 px-1.5 py-0.5 rounded text-[10px] font-bold">1</span>`.repeat(un) : '<span class="text-slate-600">-</span>';

                document.getElementById('base10Breakdown').innerText = `${val} = ${th}個千 + ${hu}個百 + ${te}個十 + ${un}個一 = ${th*1000} + ${hu*100} + ${te*10} + ${un}`;
            };

            if (input) input.oninput = updateMoney;
            if (randBtn) {
                randBtn.onclick = () => {
                    input.value = Math.floor(Math.random() * 9000) + 1000;
                    updateMoney();
                };
            }

            const compA = document.getElementById('compNumA');
            const compB = document.getElementById('compNumB');
            const compRand = document.getElementById('compRandBtn');

            const updateCompare = () => {
                const a = parseInt(compA.value) || 0;
                const b = parseInt(compB.value) || 0;

                const thA = Math.floor(a / 1000), thB = Math.floor(b / 1000);
                const huA = Math.floor((a % 1000) / 100), huB = Math.floor((b % 1000) / 100);
                const teA = Math.floor((a % 100) / 10), teB = Math.floor((b % 100) / 10);
                const unA = a % 10, unB = b % 10;

                let op = '=';
                let stepLog = '';

                if (a > b) op = '>';
                else if (a < b) op = '<';

                document.getElementById('compOp').innerText = op;

                if (thA !== thB) {
                    stepLog = `1. 先比較<b>千位</b>：數字甲的千位是 <span class="text-blue-300 font-bold">${thA}</span>，數字乙的千位是 <span class="text-emerald-300 font-bold">${thB}</span>。因為 ${thA} ${thA>thB?'>':'<'} ${thB}，所以直接判定 <span class="text-amber-300 font-bold">${a} ${op} ${b}</span>！`;
                } else if (huA !== huB) {
                    stepLog = `1. 千位皆為 ${thA}，接著比較<b>百位</b>：甲的百位是 <span class="text-blue-300 font-bold">${huA}</span>，乙的百位是 <span class="text-emerald-300 font-bold">${huB}</span>。因為 ${huA} ${huA>huB?'>':'<'} ${huB}，所以判定 <span class="text-amber-300 font-bold">${a} ${op} ${b}</span>！`;
                } else if (teA !== teB) {
                    stepLog = `1. 千位與百位皆相同，接著比較<b>十位</b>：甲的十位是 <span class="text-blue-300 font-bold">${teA}</span>，乙的十位是 <span class="text-emerald-300 font-bold">${teB}</span>。因為 ${teA} ${teA>teB?'>':'<'} ${teB}，判定 <span class="text-amber-300 font-bold">${a} ${op} ${b}</span>！`;
                } else if (unA !== unB) {
                    stepLog = `1. 千、百、十位皆相同，最後比較<b>個位</b>：甲的個位是 <span class="text-blue-300 font-bold">${unA}</span>，乙的個位是 <span class="text-emerald-300 font-bold">${unB}</span>。因為 ${unA} ${unA>unB?'>':'<'} ${unB}，判定 <span class="text-amber-300 font-bold">${a} ${op} ${b}</span>！`;
                } else {
                    stepLog = `千、百、十、個位每個位值數值通通相同，所以 <span class="text-amber-300 font-bold">${a} = ${b}</span>！`;
                }

                document.getElementById('compSteps').innerHTML = stepLog;
            };

            if (compA) compA.oninput = updateCompare;
            if (compB) compB.oninput = updateCompare;
            if (compRand) {
                compRand.onclick = () => {
                    const base = Math.floor(Math.random() * 8000) + 1000;
                    compA.value = base;
                    compB.value = base + (Math.floor(Math.random() * 5) - 2) * 10;
                    updateCompare();
                };
            }

            updateMoney();
            updateCompare();
        }

        function renderCalcDemo() {

        function initCalcLogic() {
            const aInput = document.getElementById('calcNumA');
            const bInput = document.getElementById('calcNumB');
            const randBtn = document.getElementById('calcRandomBtn');

            window.updateCalcLogic = () => {
                let a = parseInt(aInput.value) || 0;
                let b = parseInt(bInput.value) || 0;

                if (calcCurrentOp === '-' && a < b) {
                    const temp = a; a = b; b = temp;
                    aInput.value = a; bInput.value = b;
                }

                let ans = calcCurrentOp === '-' ? (a - b) : (a + b);
                const pad5 = (n) => String(n).padStart(5, ' ');
                const strA = pad5(a);
                const strB = pad5(b);
                const strAns = pad5(ans);

                document.getElementById('vCarryRow').innerHTML = `<span></span><span></span><span></span><span></span><span></span>`;

                document.getElementById('vNumA').innerHTML = strA.split('').map(c => `<span>${c===' '?'&nbsp;':c}</span>`).join('');
                document.getElementById('vNumB').innerHTML = `<span class="text-emerald-400 font-extrabold">${calcCurrentOp==='-'?'-':'+'}</span>` + strB.substring(1).split('').map(c => `<span>${c===' '?'&nbsp;':c}</span>`).join('');
                document.getElementById('vAns').innerHTML = strAns.split('').map(c => `<span>${c===' '?'&nbsp;':c}</span>`).join('');

                if (calcCurrentOp === '+') {
                    document.getElementById('calcTip').innerHTML = `<div class="font-bold text-emerald-300 mb-1">加法進位提示：</div>1. 個位相加滿 10 向十位進 1。<br>2. 計算結果：<span class="text-amber-300 font-bold">${a} + ${b} = ${ans}</span>`;
                } else if (calcCurrentOp === '-') {
                    document.getElementById('calcTip').innerHTML = `<div class="font-bold text-emerald-300 mb-1">減法退位提示：</div>1. 個位不夠減時，從十位借 1 當作 10。<br>2. 計算結果：<span class="text-amber-300 font-bold">${a} - ${b} = ${ans}</span>`;
                } else {
                    document.getElementById('calcTip').innerHTML = `<div class="font-bold text-emerald-300 mb-1">2-3 加與減驗算算式：</div>減法答案驗算：<span class="text-amber-300 font-bold">${ans} + ${b} = ${a}</span><br>加法答案驗算：<span class="text-amber-300 font-bold">${a+b} - ${b} = ${a}</span>`;
                }
            };

            if (aInput) aInput.oninput = window.updateCalcLogic;
            if (bInput) bInput.oninput = window.updateCalcLogic;
            if (randBtn) {
                randBtn.onclick = () => {
                    aInput.value = Math.floor(Math.random() * 7000) + 1500;
                    bInput.value = Math.floor(Math.random() * 1200) + 200;
                    window.updateCalcLogic();
                };
            }

            window.updateCalcLogic();
        }

            const info = document.getElementById('angleInfoText');

            const drawAngle = () => {
                const deg = parseInt(range.value) || 90;
                valText.innerText = `${deg}°`;

                const rad = (deg * Math.PI) / 180;
                const r = 80;
                const cx = 120, cy = 130;

                const x1 = cx + r;
                const y1 = cy;
                const x2 = cx + r * Math.cos(-rad);
                const y2 = cy + r * Math.sin(-rad);

                let arcSvg = '';
                if (deg === 90) {
                    arcSvg = `<path d="M ${cx+20} ${cy} L ${cx+20} ${cy-20} L ${cx} ${cy-20}" fill="none" stroke="#f59e0b" stroke-width="2"/>`;
                } else {
                    const arcR = 30;
                    const ax2 = cx + arcR * Math.cos(-rad);
                    const ay2 = cy + arcR * Math.sin(-rad);
                    const largeArc = deg > 180 ? 1 : 0;
                    arcSvg = `<path d="M ${cx+arcR} ${cy} A ${arcR} ${arcR} 0 ${largeArc} 0 ${ax2} ${ay2}" fill="rgba(56,189,248,0.2)" stroke="#f59e0b" stroke-width="2"/>`;
                }

                svg.innerHTML = `
                    <line x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
                    <line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
                    <circle cx="${cx}" cy="${cy}" r="5" fill="#f59e0b"/>
                    ${arcSvg}

                if (deg < 90) {
                    info.innerHTML = `角度大小：<b>${deg}°</b>，比直角(90°)小，是一個 <b class="text-amber-300">銳角</b>！`;

                }
            };

            if (range) range.oninput = drawAngle;
            drawAngle();
        }

            return `
                <div class="w-full flex flex-col items-center text-center">
                    <div class="text-xs text-slate-300 mb-2 font-bold"><i class="fa-solid fa-divide text-emerald-400 mr-1"></i>6-1~6-3 分裝、平分與除法直式：</div>
                    <div class="flex items-center gap-2 mb-3">
                        <span class="text-xs text-slate-300">被除數：</span>
                        <input type="number" id="divNumA" value="17" min="1" max="40" class="w-14 bg-slate-900 text-emerald-300 font-mono text-center font-bold px-1.5 py-1 rounded-lg border border-emerald-500/40 text-sm">
                        <span class="text-xs text-slate-300">÷ 除數：</span>
                        <input type="number" id="divNumB" value="5" min="1" max="10" class="w-14 bg-slate-900 text-emerald-300 font-mono text-center font-bold px-1.5 py-1 rounded-lg border border-emerald-500/40 text-sm">
                        <button id="divRandBtn" class="bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-1.5 rounded-lg text-slate-300 border border-white/10"><i class="fa-solid fa-dice"></i> 隨機出題</button>
                    </div>

                    <div id="divGroupVisual" class="flex flex-wrap gap-2 justify-center max-w-md bg-slate-900/90 p-3.5 rounded-2xl border border-emerald-500/30 my-1 min-h-[80px] items-center">
                    </div>

                    <div id="divFormula" class="text-xs text-emerald-200 font-mono bg-slate-900/80 px-4 py-2 rounded-xl border border-white/10 mt-2">
                        17 ÷ 5 = 3 ... 2 (商數為 3，餘數為 2)
                    </div>
                </div>
            `;
        }

        function initDivisionLogic() {
            const aInput = document.getElementById('divNumA');
            const bInput = document.getElementById('divNumB');
            const randBtn = document.getElementById('divRandBtn');
            const groupVis = document.getElementById('divGroupVisual');
            const formText = document.getElementById('divFormula');

            const updateDiv = () => {
                const a = parseInt(aInput.value) || 1;
                const b = parseInt(bInput.value) || 1;
                const quo = Math.floor(a / b);
                const rem = a % b;

                let html = "";
                for (let i = 0; i < quo; i++) {
                    html += `
                        <div class="bg-emerald-950/90 border border-emerald-400/60 p-2 rounded-xl flex flex-col items-center shadow-md">
                            <span class="text-[10px] text-emerald-300 font-bold mb-1 border-b border-emerald-500/30 w-full text-center pb-0.5">第 ${i+1} 組</span>
                            <div class="flex items-center gap-1">
                                ${'<div class="w-5 h-5 rounded-full bg-emerald-500/30 border border-emerald-400 flex items-center justify-center text-[10px] text-emerald-200 shadow-sm"><i class="fa-solid fa-apple-whole"></i></div>'.repeat(b)}
                            </div>
                        </div>
                    `;
                }
                if (rem > 0) {
                    html += `
                        <div class="bg-rose-950/90 border border-rose-400/60 p-2 rounded-xl flex flex-col items-center shadow-md">
                            <span class="text-[10px] text-rose-300 font-bold mb-1 border-b border-rose-500/30 w-full text-center pb-0.5">剩下的 (餘數)</span>
                            <div class="flex items-center gap-1">
                                ${'<div class="w-5 h-5 rounded-full bg-rose-500/30 border border-rose-400 flex items-center justify-center text-[10px] text-rose-200 shadow-sm"><i class="fa-solid fa-apple-whole"></i></div>'.repeat(rem)}
                            </div>
                        </div>
                    `;
                }

                groupVis.innerHTML = html || `<span class="text-slate-500 text-xs">無結果</span>`;
                formText.innerHTML = `除法結果：<b>${a} ÷ ${b} = <span class="text-cyan-300 font-bold">${quo}</span> ... <span class="text-rose-300 font-bold">${rem}</span></b><br><span class="text-[11px] text-amber-300">驗算算式：${b} × ${quo} + ${rem} = ${a}</span>`;
            };

            if (aInput) aInput.oninput = updateDiv;
            if (bInput) bInput.oninput = updateDiv;
            if (randBtn) {
                randBtn.onclick = () => {
                    aInput.value = Math.floor(Math.random() * 25) + 8;
                    bInput.value = Math.floor(Math.random() * 5) + 2;
                    updateDiv();
                };
            }

            updateDiv();
        }

        function renderScaleDemo() {
            return `
                <div class="w-full flex flex-col items-center text-center">
                    <div class="text-xs text-slate-300 mb-2 font-bold"><i class="fa-solid fa-weight-hanging text-yellow-400 mr-1"></i>7-1~7-5 磅秤報讀與公斤公克換算：</div>
                    <div class="flex items-center gap-2 mb-3">
                        <span class="text-xs text-slate-300">調整重量：</span>
                        <input type="range" id="scaleVal" min="0" max="3000" step="50" value="1350" class="w-48 accent-yellow-400">
                        <span id="scaleGramText" class="text-sm font-mono font-bold text-yellow-300 w-20">1350 g</span>
                    </div>

                    <div class="bg-slate-900/90 p-4 rounded-2xl border border-yellow-500/30 my-1 flex flex-col items-center justify-center relative w-56 h-56">
                        <svg id="scaleDialSvg" width="200" height="200" viewBox="0 0 200 200">
                        </svg>
                    </div>

                    <div id="scaleResultText" class="text-xs text-yellow-200 font-mono bg-slate-900/80 px-4 py-2 rounded-xl border border-white/10 mt-2">
                        1350 公克 = 1 公斤 350 公克 (1kg 350g)
                    </div>
                </div>
            `;
        }

        function initScaleLogic() {
            const slider = document.getElementById('scaleVal');
            const textG = document.getElementById('scaleGramText');
            const svg = document.getElementById('scaleDialSvg');
            const result = document.getElementById('scaleResultText');

            const drawScale = () => {
                const g = parseInt(slider.value) || 0;
                const kg = Math.floor(g / 1000);
                const remG = g % 1000;

                textG.innerText = `${g} g`;

                let ticksSvg = `<circle cx="100" cy="100" r="85" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>`;
                
                for (let i = 0; i < 30; i++) {
                    const angle = (i * 12 - 90) * (Math.PI / 180);
                    const isKg = i % 10 === 0;
                    const r1 = 80;
                    const r2 = isKg ? 65 : 73;
                    const x1 = 100 + r1 * Math.cos(angle);
                    const y1 = 100 + r1 * Math.sin(angle);
                    const x2 = 100 + r2 * Math.cos(angle);
                    const y2 = 100 + r2 * Math.sin(angle);

                    ticksSvg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${isKg?'#0f172a':'#64748b'}" stroke-width="${isKg?3:1.5}"/>`;

                    if (isKg) {
                        const kgLabel = i / 10;
                        const lx = 100 + 52 * Math.cos(angle);
                        const ly = 100 + 52 * Math.sin(angle) + 4;
                        ticksSvg += `<text x="${lx}" y="${ly}" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">${kgLabel}kg</text>`;
                    }
                }

                const pointerAngle = ((g / 3000) * 360 - 90) * (Math.PI / 180);
                const px = 100 + 68 * Math.cos(pointerAngle);
                const py = 100 + 68 * Math.sin(pointerAngle);

                ticksSvg += `
                    <line x1="100" y1="100" x2="${px}" y2="${py}" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
                    <circle cx="100" cy="100" r="7" fill="#dc2626"/>
                    <circle cx="100" cy="100" r="3" fill="#ffffff"/>
                `;

                svg.innerHTML = ticksSvg;
                result.innerHTML = `磅秤讀數：<b>${g} 公克</b> = <span class="text-cyan-300 font-bold">${kg}</span> 公斤 <span class="text-yellow-300 font-bold">${remG}</span> 公克 (${kg}kg ${remG}g)`;
            };

            if (slider) slider.oninput = drawScale;
            drawScale();
        }

        function renderFractionDemo() {
            return `
                <div class="w-full flex flex-col items-center text-center">
                    <div class="text-xs text-slate-300 mb-2 font-bold"><i class="fa-solid fa-chart-pie text-fuchsia-400 mr-1"></i>8-1~8-3 認識分數與分數派圖：</div>
                    <div class="flex items-center gap-3 mb-3">
                        <div class="flex items-center gap-1">
                            <span class="text-xs text-slate-300">分子 (取幾份)：</span>
                            <button onclick="changeFraction(0, -1)" class="w-6 h-6 bg-slate-800 text-white rounded font-bold text-xs">-</button>
                            <span id="fracNum" class="text-sm font-bold text-fuchsia-300 font-mono w-6">3</span>
                            <button onclick="changeFraction(0, 1)" class="w-6 h-6 bg-slate-800 text-white rounded font-bold text-xs">+</button>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="text-xs text-slate-300">分母 (平分成)：</span>
                            <button onclick="changeFraction(-1, 0)" class="w-6 h-6 bg-slate-800 text-white rounded font-bold text-xs">-</button>
                            <span id="fracDen" class="text-sm font-bold text-fuchsia-300 font-mono w-6">8</span>
                            <button onclick="changeFraction(1, 0)" class="w-6 h-6 bg-slate-800 text-white rounded font-bold text-xs">+</button>
                        </div>
                    </div>

                    <div class="bg-slate-900/90 p-4 rounded-2xl border border-fuchsia-500/30 my-1 flex items-center justify-center relative w-48 h-48">
                        <svg id="fracPieSvg" width="160" height="160" viewBox="0 0 160 160">
                        </svg>
                    </div>

                    <div id="fracDesc" class="text-xs text-fuchsia-200 font-mono bg-slate-900/80 px-4 py-2 rounded-xl border border-white/10 mt-2">
                        分數表示：八分之三 (3/8)
                    </div>
                </div>
            `;
        }

        let fracD = 8, fracN = 3;

        function changeFraction(denDelta, numDelta) {
            fracD = Math.max(1, Math.min(12, fracD + denDelta));
            fracN = Math.max(0, Math.min(fracD, fracN + numDelta));
            document.getElementById('fracDen').innerText = fracD;
            document.getElementById('fracNum').innerText = fracN;
            if (typeof updateFractionView === 'function') updateFractionView();
        }

        function initFractionLogic() {
            const svg = document.getElementById('fracPieSvg');
            const desc = document.getElementById('fracDesc');

            window.updateFractionView = () => {
                const cx = 80, cy = 80, r = 70;
                let pathSvg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#334155" stroke="#ec4899" stroke-width="3"/>`;

                for (let i = 0; i < fracD; i++) {
                    const a1 = (i * (360 / fracD) - 90) * (Math.PI / 180);
                    const a2 = ((i + 1) * (360 / fracD) - 90) * (Math.PI / 180);

                    const x1 = cx + r * Math.cos(a1);
                    const y1 = cy + r * Math.sin(a1);
                    const x2 = cx + r * Math.cos(a2);
                    const y2 = cy + r * Math.sin(a2);

                    const largeArc = (360 / fracD) > 180 ? 1 : 0;
                    const isFilled = i < fracN;

                    if (fracD === 1) {
                        pathSvg += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fracN===1?'#d946ef':'#334155'}"/>`;
                    } else {
                        pathSvg += `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${largeArc} 1 ${x2} ${y2} Z" fill="${isFilled?'#d946ef':'#334155'}" stroke="#0f172a" stroke-width="2"/>`;
                    }
                }

                svg.innerHTML = pathSvg;

                const chineseNum = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二"];
                const denStr = chineseNum[fracD] || fracD;
                const numStr = chineseNum[fracN] || fracN;

                desc.innerHTML = `讀作：<b>${denStr}分之${numStr}</b> (<span class="text-cyan-300 font-bold">${fracN}/${fracD}</span>)<br>` +
                    (fracN === fracD ? `<span class="text-emerald-300 font-bold">當分子等於分母時，${fracN}/${fracD} 等於 1！</span>` : `<span class="text-slate-300">將 1 個圓形平分成 ${fracD} 份，取其中的 ${fracN} 份。</span>`);
            };

            window.updateFractionView();
        }

        let tallyData = { "蘋果": 7, "香蕉": 12, "西瓜": 4, "橘子": 9 };

        function renderPatternsDemo() {
            return `
                <div class="w-full flex flex-col items-center text-center">
                    <div class="text-xs text-slate-300 mb-2 font-bold"><i class="fa-solid fa-table-cells text-cyan-400 mr-1"></i>9-1 & 9-2 分類與正字劃記表格：</div>
                    <div class="text-xs text-slate-300 mb-2">點擊水果增加數量，自動即時畫「正」字與統計數字：</div>
                    <div class="flex flex-wrap justify-center gap-2 mb-3">
                        <button onclick="addTally('蘋果')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs border border-white/10">蘋果 +1</button>
                        <button onclick="addTally('香蕉')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs border border-white/10">香蕉 +1</button>
                        <button onclick="addTally('西瓜')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs border border-white/10">西瓜 +1</button>
                        <button onclick="addTally('橘子')" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs border border-white/10">橘子 +1</button>
                    </div>

                    <div class="w-full max-w-md bg-slate-900/90 rounded-xl border border-white/10 overflow-hidden text-xs my-1">
                        <table class="w-full text-left">
                            <thead class="bg-slate-800/80 text-cyan-300 border-b border-white/10">
                                <tr>
                                    <th class="p-2.5">水果項目</th>
                                    <th class="p-2.5">正字劃記 (SVG 筆劃)</th>
                                    <th class="p-2.5">數量 (人)</th>
                                </tr>
                            </thead>
                            <tbody id="tallyTbody" class="text-slate-200">
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function addTally(fruit) {
            if (tallyData[fruit] !== undefined) {
                tallyData[fruit]++;
                renderTallyTable();
            }
        }

        function renderTallyTable() {
            const tbody = document.getElementById('tallyTbody');
            if (!tbody) return;

            let total = 0;
            let rowsHtml = '';

            const renderTallySvg = (num) => {
                if (num === 0) return '<span class="text-slate-500">-</span>';
                const fullCount = Math.floor(num / 5);
                const rem = num % 5;

                let svgStr = '';

                // Correct standard 1~5 stroke rendering for "正" tally mark
                const makeStrokeSvg = (strokes) => {
                    let paths = '';
                    // Stroke 1: Top horizontal (一)
                    if (strokes >= 1) paths += `<line x1="3" y1="5" x2="25" y2="5" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>`;
                    // Stroke 2: Center vertical (丨)
                    if (strokes >= 2) paths += `<line x1="14" y1="5" x2="14" y2="23" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>`;
                    // Stroke 3: Middle-right horizontal (─)
                    if (strokes >= 3) paths += `<line x1="14" y1="14" x2="25" y2="14" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>`;
                    // Stroke 4: Left lower vertical (從左下 y=23 往上畫至中間 y=14)
                    if (strokes >= 4) paths += `<line x1="3" y1="14" x2="3" y2="23" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>`;
                    // Stroke 5: Bottom horizontal (一)
                    if (strokes >= 5) paths += `<line x1="3" y1="23" x2="25" y2="23" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>`;
                    return `<svg width="28" height="28" viewBox="0 0 28 28" class="inline-block mx-0.5">${paths}</svg>`;
                };

                for (let i = 0; i < fullCount; i++) {
                    svgStr += makeStrokeSvg(5);
                }
                if (rem > 0) {
                    svgStr += makeStrokeSvg(rem);
                }

                return svgStr;
            };

            for (const [fruit, count] of Object.entries(tallyData)) {
                total += count;
                rowsHtml += `
                    <tr class="border-b border-white/10">
                        <td class="p-2 font-bold text-sm">${fruit}</td>
                        <td class="p-2 align-middle">${renderTallySvg(count)}</td>
                        <td class="p-2 font-bold text-cyan-300 font-mono text-sm">${count}</td>
                    </tr>
                `;
            }

            rowsHtml += `
                <tr class="font-bold text-emerald-300 bg-slate-900/60">
                    <td class="p-2">合計</td>
                    <td class="p-2">-</td>
                    <td class="p-2 font-mono text-sm">${total}</td>
                </tr>
            `;

            tbody.innerHTML = rowsHtml;
        }

        function initPatternsLogic() {
            renderTallyTable();
        }
    </script>
</body>
</html>
